name: Receiver CI

on:
  push:
    branches: [main, "delivery/**"]
  pull_request:
    branches: [main]

jobs:
  independent-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_receiver
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Extraer paquete certificado (vendor)
        run: node scripts/prepare-vendor.mjs
      - run: npm install
      - name: Verificar entrega certificada
        run: npm run verify
      - name: Instalar módulo y pruebas PostgreSQL aislado
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_receiver
        run: npm test
